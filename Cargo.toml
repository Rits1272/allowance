[package]
name = "allowance"
version = "0.1.0"
edition = "2021"
description = "A spending guard for AI agents: pays HTTP 402 challenges over Lightning, under limits the agent cannot change."
license = "MIT"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.22"
hex = "0.4"
async-trait = "0.1"
